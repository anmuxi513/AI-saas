<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>AI 训练平台</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(160deg, #10204f 0%, #14295f 55%, #1a3478 100%);
    color: #fff;
    font-family: 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif;
    user-select: none;
  }
  .logo {
    width: 76px; height: 76px;
    border-radius: 22px;
    background: linear-gradient(135deg, #1e40af, #2563eb);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 14px 38px rgba(0, 0, 0, 0.38), inset 0 1px 0 rgba(255,255,255,0.2);
  }
  h1 { font-size: 22px; font-weight: 600; margin: 24px 0 6px; letter-spacing: 0.02em; }
  p  { font-size: 13px; color: rgba(255, 255, 255, 0.6); margin: 0; }
  .spinner {
    margin-top: 28px;
    width: 26px; height: 26px;
    border: 3px solid rgba(255, 255, 255, 0.18);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="logo">
    <svg width="34" height="34" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <rect x="3" y="3" width="18" height="18" rx="5" fill="#fff" />
      <path d="M8 8v8M12 8v8M16 8v8" stroke="#1E40AF" stroke-width="1.8" stroke-linecap="round" />
    </svg>
  </div>
  <h1>AI 训练平台</h1>
  <p>正在启动本地服务…</p>
  <div class="spinner"></div>
</body>
</html>
